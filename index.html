<!DOCTYPE html>
<html>

<head>
    <title>Page Title</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/88823665-camp-66/mystyle.css">

    <!-- Google Font Thai Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@100..900&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">

    <!-- Google Font h1 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@100..900&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <script src="js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container mt-4">
        <!-- ชื่อ -->
        <div class="mb-3 row">
            <label for="Firstname" class="col-sm-3 col-form-label">ชื่อ</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="Firstname" name="Firstname" placeholder="ชื่อ">
            </div>
        </div>

        <!-- สกุล -->
        <div class="mb-3 row">
            <label for="Lastname" class="col-sm-3 col-form-label">สกุล</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="Lastname" name="Lastname">
            </div>
        </div>

        <!-- วัน/เดือน/ปีเกิด -->
        <div class="mb-3 row">
            <label for="Date" class="col-sm-3 col-form-label">วัน/เดือน/ปีเกิด</label>
            <div class="col-sm-9">
                <input type="date" class="form-control" id="Date" name="Date">
            </div>
        </div>

        <!-- อายุ -->
        <div class="mb-3 row">
            <label for="Age" class="col-sm-3 col-form-label">อายุ</label>
            <div class="col-sm-9">
                <input type="number" class="form-control" id="Age" name="Age" min="0">
            </div>
        </div>

        <!-- เพศ -->
        <div class="mb-3">
            <label class="form-label">เพศ</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="SexMale" name="Sex" value="Male">
                <label for="SexMale" class="form-check-label">ชาย</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="SexFemale" name="Sex" value="Female">
                <label for="SexFemale" class="form-check-label">หญิง</label>
            </div>
        </div>

        <!-- รูป -->
        <div class="mb-3 row">
            <label for="Photo" class="col-sm-3 col-form-label">รูป</label>
            <div class="col-sm-9">
                <input type="file" class="form-control" id="Photo" name="Photo">
            </div>
        </div>

        <!-- ที่อยู่ -->
        <div class="mb-3">
            <label for="Address" class="form-label">ที่อยู่</label>
            <textarea class="form-control" id="Address" name="Address" rows="3"></textarea>
        </div>

        <!-- สีที่ชอบ -->
        <div class="mb-3">
            <label for="Color" class="form-label">สีที่ชอบ</label>
            <select class="form-select" id="Color" name="Color">
                <option value="สีแดง">สีแดง</option>
                <option value="สีน้ำเงิน">สีน้ำเงิน</option>
                <option value="สีเขียว">สีเขียว</option>
                <option value="สีเหลือง">สีเหลือง</option>
            </select>
        </div>

        <!-- แนวเพลงที่ชอบ -->
        <div class="mb-3">
            <label class="form-label">แนวเพลงที่ชอบ</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="เพื่อชีวิต" name="Music" value="เพื่อชีวิต">
                <label for="เพื่อชีวิต" class="form-check-label">เพื่อชีวิต</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="ลูกทุ่ง" name="Music" value="ลูกทุ่ง">
                <label for="ลูกทุ่ง" class="form-check-label">ลูกทุ่ง</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="อื่นๆ" name="Music" value="อื่นๆ">
                <label for="อื่นๆ" class="form-check-label">อื่นๆ</label>
            </div>
        </div>

        <!-- ยินยอมให้เก็บข้อมูล -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="Check" name="Consent" value="Agree">
            <label for="Check" class="form-check-label">ยินยอมให้เก็บข้อมูล</label>
        </div>

        <!-- ปุ่ม Reset และ Submit -->
        <div class="d-flex justify-content-between">
            <button type="reset" class="btn btn-danger px-4">Reset</button>
            <button type="submit" class="btn btn-success px-4">Submit</button>
        </div>
    </div>
</body>

</html>
